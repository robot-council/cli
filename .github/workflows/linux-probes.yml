# Throwaway: measurements for cli#141, cli#85 and cli#40 on a Linux runner. Never merged.
name: linux-probes
on: pull_request
permissions:
  contents: read
jobs:
  probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-dev --no-scripts --no-interaction --no-progress
      - name: Environment
        run: |
          uname -a; php -v | head -1; . /etc/os-release; echo "$PRETTY_NAME"
      - name: 'cli#141: stream_select over a quiet pipe'
        run: php .github/probes/probe141.php 10
      - name: Install a Secret Service
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gnome-keyring libsecret-tools dbus-x11 >/dev/null
      - name: 'cli#40 then cli#85: secret-tool'
        run: |
          dbus-run-session -- bash -c '
            printf "probe-password" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            gnome-keyring-daemon --start --components=secrets >/dev/null
            sleep 1
            echo "secret-tool at $(command -v secret-tool)"
            echo "===== cli#40"; php .github/probes/probe40.php; echo "probe40 rc=$?"
            echo "===== cli#85"; bash .github/probes/probe85.sh
          '
