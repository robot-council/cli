# Throwaway: measurements for cli#141, cli#85 and cli#40 on a Linux runner. Never merged.
name: linux-probes
on: pull_request
permissions:
  contents: read
jobs:
  probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Install a Secret Service
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gnome-keyring libsecret-tools dbus-x11 >/dev/null
      - name: 'cli#40: the Pest test, as written and against a store that collapses case'
        run: |
          cat > /tmp/run.sh <<'SH'
          printf "probe-password" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
          gnome-keyring-daemon --start --components=secrets >/dev/null
          sleep 1
          echo "===== as written"
          vendor/bin/pest tests/Feature/SecretToolStoreTest.php; echo "as-written rc=$?"
          cp app/Support/Credentials/SecretToolStore.php /tmp/store.orig
          perl -pi -e 's/self::ATTRIBUTE, \$service\]/self::ATTRIBUTE, strtolower(\$service)]/g' app/Support/Credentials/SecretToolStore.php
          echo "mutated lines: $(grep -c 'strtolower(\$service)' app/Support/Credentials/SecretToolStore.php)"
          echo "===== collapsing store (must fail)"
          vendor/bin/pest tests/Feature/SecretToolStoreTest.php; echo "collapsing rc=$?"
          cp /tmp/store.orig app/Support/Credentials/SecretToolStore.php
          SH
          dbus-run-session -- bash /tmp/run.sh
