name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Unlike `robot-council/core`, this repository is an application rather than a package, so it
  # commits `composer.lock` and the suite runs against the versions it pins. There is no
  # `prefer-lowest` cell, because nothing here is installed into somebody else's dependency graph.
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.5, 8.4]

    name: P${{ matrix.php }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, fileinfo, intl
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci

  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Run PHPStan
        run: vendor/bin/phpstan --error-format=github

  pint:
    name: pint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Check code style
        run: vendor/bin/pint --test

  rector:
    name: rector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Run Rector (dry run)
        run: vendor/bin/rector --dry-run --no-progress-bar

  # Every other job installs dev dependencies, so a production dependency that arrives only
  # through a dev one is invisible to all of them. `illuminate/http` did exactly that, through
  # larastan, and every release up to v0.4.1 failed its first HTTP request (#237). This job
  # installs from the lock the way a user does, without dev dependencies.
  production-install:
    name: production install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install composer dependencies without dev dependencies
        uses: ramsey/composer-install@v4
        with:
          composer-options: --no-dev

      - name: Check every import under app/ resolves
        run: php .github/scripts/check-production-imports.php

      # The import scan cannot see a class the container resolves by name, so resolve the HTTP
      # client for real: an unreachable host must fail at the network, not in the container.
      - name: Reach the network from enroll
        run: |
          set +e
          out=$(./robot-council enroll --service=https://example.invalid --harness=claude --machine-label=ci 2>&1)
          rc=$?
          echo "$out"
          echo "exit=$rc"
          [ "$rc" -ne 0 ] && grep -q 'Could not reach the service' <<< "$out"

  generator:
    name: generator (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # The floor the skill documents, and a current release. The floor is what matters here:
        # the suite is written to run under whatever Python a developer already has, so a
        # 3.10-only construct would otherwise reach `main` and fail for them alone.
        python: ['3.9', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run the release generator's tests
        run: python3 -m unittest discover -s .claude/skills/writing-release-notes -v

  # The one check the `main` ruleset requires. It always runs, and it passes only when every
  # job above succeeded, so a failed, cancelled, or skipped job all block the merge.
  ci-passed:
    name: ci-passed
    if: always()
    needs: [tests, phpstan, pint, rector, production-install, generator]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          TESTS: ${{ needs.tests.result }}
          PHPSTAN: ${{ needs.phpstan.result }}
          PINT: ${{ needs.pint.result }}
          RECTOR: ${{ needs.rector.result }}
          PRODUCTION_INSTALL: ${{ needs.production-install.result }}
          GENERATOR: ${{ needs.generator.result }}
        run: |
          echo "tests=$TESTS phpstan=$PHPSTAN pint=$PINT rector=$RECTOR production-install=$PRODUCTION_INSTALL generator=$GENERATOR"
          [ "$TESTS" = success ] && [ "$PHPSTAN" = success ] && [ "$PINT" = success ] && [ "$RECTOR" = success ] && [ "$PRODUCTION_INSTALL" = success ] && [ "$GENERATOR" = success ]
